# vesma-cortex — development library for the vesma-cortex decision model
# (ADR 0001 + owner addendum P2: dual-epoch delivery; this repo is the
# TRAIN-EPOCH library. The runtime epoch is a single self-contained ONNX
# artifact bundled into the engine — this package is never a runtime dep
# of the engine and is NOT published to PyPI before the A5 verdict).
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vesma-cortex"
version = "0.2.0"
description = "Development library for vesma-cortex — the local is-duplicate decision model (features, D/N training, selection, export, single-shot eval)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Owner decision 2026-09-29 (Apache-2.0 vs MIT at TL discretion; Apache-2.0
# chosen: patent grant + family default — the engine and canon are Apache-2.0).

# Dependency rationale (ADR 0001, addendum P2 — heavy deps live ONLY here):
# - numpy/onnxruntime — feature math, artifact validation and eval-side
#   inference; pins mirror the engine core (onnxruntime>=1.20, NM-1c) so
#   export targets the same runtime that will load the artifact.
# - lightgbm — candidate D (gradient boosting over pair features).
# - scikit-learn — CV machinery + balanced-accuracy/Brier metrics.
# - skl2onnx + onnxmltools — ONNX export of the D candidate. skl2onnx >= 1.20
#   no longer bundles the LightGBM converter; onnxmltools ships it (A3b
#   lesson: convert_sklearn alone cannot convert LGBMClassifier).
# - torch — train-only extra (CPU): candidate N head + torch.onnx export;
#   matches the engine's training-extra isolation (ADR-0021 pattern).
# - blake2/sha256 need NO dependency: hashlib covers both from stdlib.
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "skl2onnx>=1.17",
    "onnxmltools>=1.16",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
]

# torch MUST resolve to the CPU wheel (A3c): the default PyPI linux wheel
# is the CUDA build (~4 GB of nvidia-*/triton deps on a machine with no
# NVIDIA GPU — charter §6 locality). Explicit torch-only CPU index; the
# XPU walkthrough environment installs torch separately (runbook,
# docs/runbooks/xpu-walkthrough.md) and never uses this lock.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# PEP 735 dependency group (NOT an extra): `uv run pytest` must work on a
# fresh clone without flags — uv installs dev groups by default, extras only
# with --extra. Caught on the TL gate (agent ran with a preset PYTHONPATH).
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
# CLI stubs (A3a): export-corpus / pretrain / train / select /
# export-artifact / eval — see cortex/cli/main.py.
cortex = "cortex.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

# Privacy gate on the sdist (charter §6, ADR 0003 R2): training-side data
# and local scratch never ship. Recursive `/**` forms are MANDATORY:
# hatchling's bare directory patterns (`/datasets`) match the directory
# entry but do not prune its children — caught empirically on the 0.2.0
# sdist (datasets/ leaked; the earlier data/stage2-dry leak had the same
# root cause, fixed here the same way). Tracked artifacts/{manifests,runs}
# (run logs referenced by reports) stay.
[tool.hatch.build.targets.sdist]
exclude = [
    "/data",
    "/data/**",
    "/datasets",
    "/datasets/**",
    "/.local",
    "/.local/**",
    "/dist",
    "/dist/**",
]

# Model registry in the wheel (ADR 0003 R5: "wheel с весами — реестр внутри
# пакета"). Path choice: the import package of this project is `cortex`
# (packages above), so the canonical in-wheel location is
# `cortex/models/vesma-cortex-v1/` — loadable via the importlib.resources
# pattern (inference-v1.md §4/§6, NanoProvider precedent:
# importlib.resources.files("cortex") / "models" / "vesma-cortex-v1").
# The engine's `vesmaro/models/...` path is its OWN vendored layout
# (model-registry.md §5: the engine copies the artifact by fingerprint at
# engine-release time) and is deliberately NOT replicated here.
# Only the machine bundle ships (weights + manifest); MODEL_CARD.md /
# eval-results.json are repo documentation, not runtime payload.
# force-include is an explicit mapping, so the global `*.onnx` gitignore
# pattern does not block it.
[tool.hatch.build.targets.wheel.force-include]
"models/vesma-cortex-v1/model.onnx" = "cortex/models/vesma-cortex-v1/model.onnx"
"models/vesma-cortex-v1/manifest.json" = "cortex/models/vesma-cortex-v1/manifest.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
